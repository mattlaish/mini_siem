name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Static security scan
        run: python security_static_scan.py
      - name: Tests
        run: pytest -q
      - name: Import smoke
        run: python -c "import dashboard, siem"

  pytest-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minisiem_admin
          POSTGRES_PASSWORD: minisiem_admin_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minisiem_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MINISIEM_TEST_PG_HOST: 127.0.0.1
      MINISIEM_TEST_PG_PORT: "5432"
      MINISIEM_TEST_PG_USER: minisiem_admin
      MINISIEM_TEST_PG_PASSWORD: minisiem_admin_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (incl. PostgreSQL driver)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "psycopg2-binary>=2.9"
      - name: PostgreSQL integration tests
        run: pytest -q tests/test_postgres_integration.py
