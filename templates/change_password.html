<!DOCTYPE html>
<html lang="en">
<head>
<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='csrf.js') }}"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mini-SIEM — Change password</title>
<style>
  :root {
    --ink:#16202b; --ink-soft:#4a5a6a; --line:#d7dee5; --panel:#fff; --canvas:#eef1f4;
    --accent:#1f5eff; --accent-dark:#143fb0; --accent-soft:#e8eefc;
    --warn:#b5350c; --warn-soft:#fbe9e2; --amber:#9a6b00; --amber-soft:#fbf1dc;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  body { font-family:var(--sans); margin:0; background:var(--canvas); color:var(--ink);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:100%; max-width:400px; overflow:hidden; }
  .head { background:var(--ink); color:#fff; padding:20px 26px; }
  .head h1 { margin:0; font-size:17px; }
  .body { padding:22px 26px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:0 0 5px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; margin-bottom:14px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button { width:100%; padding:11px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  button:hover { background:var(--accent-dark); }
  .error { background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; }
  .forced { background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); border-radius:6px; padding:9px 12px; font-size:12.5px; margin-bottom:16px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="head"><h1>Change password</h1></div>
    <div class="body">
      {% if forced %}<div class="forced">You're using the default password. Set a new one to continue.</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="POST" action="/auth/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Current password</label>
        <input type="password" name="current_password" autocomplete="current-password" required>
        <label>New password <span style="font-weight:400;color:var(--ink-soft)">(min 8 characters)</span></label>
        <input type="password" name="new_password" autocomplete="new-password" required>
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" autocomplete="new-password" required>
        <button type="submit">Update password</button>
      </form>
    </div>
  </div>
</body>
</html>
