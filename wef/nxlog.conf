define ROOT C:\Program Files\nxlog
Moduledir %ROOT%\modules
CacheDir %ROOT%\data
Pidfile %ROOT%\data\nxlog.pid
LogFile %ROOT%\data\nxlog.log

# ==========================================
# 載入擴充模組 (保留核心功能與新增 JSON)
# ==========================================
<Extension json>
    Module      xm_json
</Extension>

<Extension _charconv>
    Module      xm_charconv
    AutodetectCharsets iso8859-2, utf-8, utf-16, utf-32
</Extension>

<Extension _fileop>
    Module      xm_fileop
    # 檢查 NXLog 自身日誌大小，超過 15MB 滾動輪替，防爆硬碟
    <Schedule>
        Every   1 hour
        Exec    if (file_exists('%LOGFILE%') and \
                   (file_size('%LOGFILE%') >= 15M)) \
                    file_cycle('%LOGFILE%', 8);
    </Schedule>
    <Schedule>
        When    @weekly
        Exec    if file_exists('%LOGFILE%') file_cycle('%LOGFILE%', 8);
    </Schedule>
</Extension>

# ==========================================
# 1. 讀取並過濾 Windows 核心資安事件
# ==========================================
<Input windows_events>
    Module      im_msvistalog
    
    # 完美修復：將 ID 拆分成四條分組單行（不超載、不換行），完美通過 Windows 核心與 NXLog 的雙重編譯檢驗
    Query       <QueryList><Query Id="0"><Select Path="Security">*[System[(EventID=4624 or EventID=4738 or EventID=4625 or EventID=4634 or EventID=4647 or EventID=4648 or EventID=4672 or EventID=4688 or EventID=1102)]]</Select><Select Path="Security">*[System[(EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4740)]]</Select><Select Path="Security">*[System[(EventID=4728 or EventID=4729 or EventID=4732 or EventID=4733 or EventID=4756 or EventID=4757 or EventID=4698 or EventID=4702 or EventID=4719)]]</Select><Select Path="System">*[System[(EventID=7045 or EventID=7040 or EventID=7034)]]</Select></Query></QueryList>

    # 使用開源版專用 Exec 腳本過濾白噪音與進行安全帳號驗證
    <Exec>
        if ($EventID == 4702) and \
           ($TaskName == '\Microsoft\Windows\SoftwareProtectionPlatform\SvcRestartTask' or \
            $TaskName == '\Microsoft\Windows\Flighting\OneSettings\RefreshCache') and \
           ($SubjectUserSid == 'S-1-5-18' or $SubjectUserSid == 'S-1-5-20') \
           drop();
    </Exec>
</Input>

# ==========================================
# 2. 轉換格式並輸出至 SIEM
# ==========================================
<Output outbound_syslog>
    Module      om_udp
    Host        192.168.1.106
    Port        514
    Exec        to_json();
</Output>

# ==========================================
# 3. 串接路由
# ==========================================
<Route r1>
    Path        windows_events => outbound_syslog
</Route>